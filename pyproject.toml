[build-system]
# Round 2: packaging tools are NOT installed and installing is forbidden.
# The in-tree stdlib-only PEP 517 backend (tooling/wheelbuild.py) builds the
# pure-Python wheel from [project] metadata and the ctf_solver/ source tree.
requires = []
build-backend = "wheelbuild"
backend-path = ["tooling"]

[project]
name = "ctf-solver"
version = "0.1.1"
description = "Semi-autonomous CTF solving extension for DeepSeek Harness (Round 1 candidate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CTF-Solver project" }]
dependencies = [
  # Intentionally empty: Round 1 must run with the existing environment only.
  # Compression support is taken from the standard library (Python >= 3.14
  # `compression.zstd`) or the already-installed `zstandard` package; the
  # implementation probes both and fails closed with a clear diagnostic.
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctf-solver = "ctf_solver.cli:main"

# Legacy Round 1 packaging hint retained only for documentation: the in-tree
# PEP 517 backend (tooling/wheelbuild.py) discovers every ctf_solver/** file
# from the source tree, so this table is ignored by the build.
[tool.setuptools]
packages = [
  "ctf_solver",
  "ctf_solver.core",
  "ctf_solver.storage",
  "ctf_solver.acp",
  "ctf_solver.evidence",
  "ctf_solver.policy",
  "ctf_solver.runtime",
  "ctf_solver.mcp",
  "ctf_solver.manager",
  "ctf_solver.delivery",
  "ctf_solver.preflight",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "real_acp: zero-model-call smoke test against the locally installed Harness ACP server (opt-in)",
  "slow: slower deterministic tests",
]
